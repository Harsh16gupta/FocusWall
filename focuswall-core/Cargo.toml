[package]
name = "focuswall-core"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
iana-time-zone = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
url = "2.5"
psl = "2.1"
thiserror = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
tracing = "0.1"
libc = "0.2"
tokio = { version = "1", features = ["io-util", "net", "sync"] }

[dev-dependencies]
tempfile = "3"
